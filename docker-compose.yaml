services:
  db:
    image: postgres:15
    container_name: aiogram_postgres
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file:
      - ./src/.env
    # No published ports: Postgres is reachable only inside the compose network.
    networks:
      - aiogram

  app:
    build:
      context: .
    image: aiogram
    container_name: aiogram_app
    restart: unless-stopped
    command: ["bash", "/aiogram/scripts/entrypoint.sh"]
    env_file:
      - ./src/.env
    volumes:
      - .:/aiogram
    networks:
      - aiogram
    depends_on:
      - db
      - redis

  redis:
    image: redis:7.4-alpine
    container_name: aiogram_redis
    restart: unless-stopped
    env_file:
      - ./src/.env
    # Password comes from src/.env; refuse to start without one.
    # appendonly keeps FSM dialog states across Redis restarts.
    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD:?REDIS_PASSWORD is not set in src/.env}\" --appendonly yes"]
    volumes:
      - redis-data:/data
    # No published ports: Redis is reachable only inside the compose network.
    networks:
      - aiogram

  celery:
    build:
      context: .
    image: aiogram
    container_name: aiogram_celery
    restart: unless-stopped
    command: sh -c "cd src && celery -A celery_app:celery worker --loglevel=INFO"
    env_file:
      - ./src/.env
    volumes:
      - .:/aiogram
    depends_on:
      - redis
    networks:
      - aiogram

  # Celery beat: starts periodic jobs (recurring operations, backups); the worker runs them.
  beat:
    build:
      context: .
    image: aiogram
    container_name: aiogram_beat
    restart: unless-stopped
    command: sh -c "cd src && celery -A celery_app:celery beat --loglevel=INFO --schedule /tmp/celerybeat-schedule"
    env_file:
      - ./src/.env
    volumes:
      - .:/aiogram
    depends_on:
      - redis
    networks:
      - aiogram

  # Optional DB admin UI, off by default: docker compose --profile tools up -d pgadmin
  # Then open http://127.0.0.1:5050 (or through an SSH tunnel on a server).
  pgadmin:
    container_name: aiogram_pgadmin
    image: dpage/pgadmin4
    profiles: ["tools"]
    env_file:
      - ./src/.env
    restart: on-failure
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - db
    networks:
      - aiogram

networks:
  aiogram:

volumes:
  postgres-data:
  redis-data:
